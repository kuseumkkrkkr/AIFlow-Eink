<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#25213d"/>
    </linearGradient>
    <marker id="cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#67e8f9"/></marker>
    <marker id="violet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c4b5fd"/></marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="60" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Offline distillation</text>
  <text x="60" y="116" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="20">Teacher guidance is removed before runtime</text>

  <rect x="70" y="175" width="280" height="150" rx="22" fill="#3a2441" stroke="#fb7185" stroke-width="2"/>
  <text x="210" y="230" text-anchor="middle" fill="#fff1f2" font-family="Arial, sans-serif" font-size="23" font-weight="700">Raster teacher</text>
  <text x="210" y="270" text-anchor="middle" fill="#fecdd3" font-family="Arial, sans-serif" font-size="19">fit only</text>
  <text x="210" y="302" text-anchor="middle" fill="#fda4af" font-family="Arial, sans-serif" font-size="17">latent memory target</text>

  <rect x="70" y="410" width="280" height="150" rx="22" fill="#153449" stroke="#22d3ee" stroke-width="2"/>
  <text x="210" y="465" text-anchor="middle" fill="#ecfeff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Online ink path</text>
  <text x="210" y="505" text-anchor="middle" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="19">prior + bridge</text>
  <text x="210" y="537" text-anchor="middle" fill="#67e8f9" font-family="Arial, sans-serif" font-size="17">learns the target space</text>

  <rect x="470" y="270" width="260" height="190" rx="22" fill="#293052" stroke="#a78bfa" stroke-width="2"/>
  <text x="600" y="335" text-anchor="middle" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Bridge fitting</text>
  <text x="600" y="375" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="20">memory → memory</text>
  <text x="600" y="415" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="18">distillation loss</text>

  <rect x="850" y="270" width="280" height="190" rx="22" fill="#1e3b35" stroke="#34d399" stroke-width="2"/>
  <text x="990" y="335" text-anchor="middle" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="25" font-weight="700">Runtime model</text>
  <text x="990" y="375" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="20">online ink only</text>
  <text x="990" y="415" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="18">teacher absent</text>

  <path d="M350 250 C405 250 410 320 460 330" fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#violet)"/>
  <path d="M350 485 C405 485 410 410 460 400" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#cyan)"/>
  <path d="M730 365 H840" stroke="#86efac" stroke-width="4" marker-end="url(#cyan)"/>
  <path d="M990 475 V555 H600 V470" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="600" y="595" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">The teacher supervises fitting, not inference</text>
</svg>
