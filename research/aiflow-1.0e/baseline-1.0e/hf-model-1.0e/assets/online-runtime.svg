<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <text x="60" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Online runtime</text>
  <text x="60" y="116" fill="#a7b6d2" font-family="Arial, sans-serif" font-size="20">Ordered ink remains the only runtime visual input</text>

  <g filter="url(#shadow)">
    <rect x="60" y="190" width="190" height="190" rx="22" fill="#152a45" stroke="#38bdf8" stroke-width="2"/>
    <path d="M100 318 C125 275 135 236 155 266 C174 294 181 229 208 252" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <circle cx="100" cy="318" r="7" fill="#fbbf24"/><circle cx="155" cy="266" r="7" fill="#fbbf24"/><circle cx="208" cy="252" r="7" fill="#fbbf24"/>
    <text x="155" y="350" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="21" font-weight="700">Ordered ink</text>
    <text x="155" y="410" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">strokes + time</text>

    <rect x="330" y="190" width="190" height="190" rx="22" fill="#192d47" stroke="#60a5fa" stroke-width="2"/>
    <text x="425" y="274" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">AIFlow</text>
    <text x="425" y="309" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="20">online prior</text>
    <text x="425" y="350" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">shape + timing</text>

    <rect x="600" y="190" width="190" height="190" rx="22" fill="#1b2d43" stroke="#a78bfa" stroke-width="2"/>
    <text x="695" y="270" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Memory</text>
    <text x="695" y="308" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="20">16 tokens</text>
    <text x="695" y="350" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">compact sequence</text>

    <rect x="870" y="190" width="270" height="190" rx="22" fill="#203044" stroke="#34d399" stroke-width="2"/>
    <text x="1005" y="270" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Text decoder</text>
    <text x="1005" y="308" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="20">free-form LaTeX</text>
    <text x="1005" y="350" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">cross-attention</text>
  </g>

  <path d="M252 285 H320" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M522 285 H590" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M792 285 H860" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="510" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">No raster image is created or consumed here</text>
</svg>
