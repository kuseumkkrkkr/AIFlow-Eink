<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <text x="60" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Sequence-to-token bridge</text>
  <text x="60" y="116" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Temporal compression preserves order while matching decoder width</text>

  <rect x="70" y="205" width="260" height="190" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="200" y="265" text-anchor="middle" fill="#eff6ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">19-channel events</text>
  <text x="200" y="310" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="19">e₁ → e₂ → … → e₁₂₈</text>
  <text x="200" y="350" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="17">stroke order + timing</text>

  <rect x="430" y="205" width="260" height="190" rx="22" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
  <text x="560" y="265" text-anchor="middle" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Temporal stride</text>
  <text x="560" y="310" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="21">/ 8</text>
  <text x="560" y="350" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="17">compact memory</text>

  <rect x="790" y="205" width="340" height="190" rx="22" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="960" y="265" text-anchor="middle" fill="#fffbeb" font-family="Arial, sans-serif" font-size="24" font-weight="700">Decoder memory</text>
  <text x="960" y="310" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="21">16 × 768</text>
  <text x="960" y="350" text-anchor="middle" fill="#fcd34d" font-family="Arial, sans-serif" font-size="17">cross-attention space</text>

  <path d="M332 300 H420" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M692 300 H780" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(90 470)">
    <rect x="0" y="0" width="100" height="42" rx="12" fill="#1d4ed8"/><text x="50" y="28" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18">e₁</text>
    <rect x="120" y="0" width="100" height="42" rx="12" fill="#2563eb"/><text x="170" y="28" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18">e₂</text>
    <rect x="240" y="0" width="100" height="42" rx="12" fill="#3b82f6"/><text x="290" y="28" text-anchor="middle" fill="#eff6ff" font-family="Arial, sans-serif" font-size="18">e₃</text>
    <text x="375" y="28" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">…</text>
    <rect x="415" y="0" width="100" height="42" rx="12" fill="#6366f1"/><text x="465" y="28" text-anchor="middle" fill="#eef2ff" font-family="Arial, sans-serif" font-size="18">m₁</text>
    <rect x="535" y="0" width="100" height="42" rx="12" fill="#7c3aed"/><text x="585" y="28" text-anchor="middle" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="18">m₂</text>
    <rect x="655" y="0" width="100" height="42" rx="12" fill="#9333ea"/><text x="705" y="28" text-anchor="middle" fill="#faf5ff" font-family="Arial, sans-serif" font-size="18">m₁₆</text>
    <text x="805" y="28" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">ordered tokens</text>
  </g>
</svg>
